{% extends 'base.html' %}
{% block title %}Новая заявка{% endblock %}
{% block content %}
<div class="content-card" style="max-width: 640px; margin: 0 auto;">
    <h1 class="h4 mb-4">Создать заявку</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100">Опубликовать заявку</button>
    </form>
</div>
{% endblock %}
